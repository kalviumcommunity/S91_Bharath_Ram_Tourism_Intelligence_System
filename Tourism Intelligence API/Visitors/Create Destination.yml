info:
  name: Create Destination
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/destinations"
  body:
    type: json
    data: |-
      {
        "name": "Marina Beach",
        "location": "Chennai",
        "category": "Beach",
        "description": "Popular tourist destination in Chennai"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
