info:
  name: Upload Destination Image
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/upload"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - C:\Users\iyapp\Downloads\des.webp
        contentType: image/webp
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
